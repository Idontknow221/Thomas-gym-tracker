<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thomas · Training Program</title>
<style>
:root{
  --bg:#0D110F;
  --paper:#161B18;
  --paper2:#1D2320;
  --ink:#F1F3EF;
  --accent:#33C98A;
  --accent-dim:#1F7A54;
  --accent-soft:#173226;
  --line:#2B322D;
  --muted:#8B9389;
  --warn:#E8763F;
  --warn-soft:#2E1F16;
  --radius:2px;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",Helvetica,Arial,sans-serif;
  min-height:100vh;padding-bottom:72px;
}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;}
input,textarea{font-family:inherit;color:var(--ink);}
.tabular{font-variant-numeric:tabular-nums;}

/* ===== Top bar ===== */
.topbar{background:#000;color:#fff;padding:18px 18px 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);}
.topbar .brand-eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.topbar h1{font-size:19px;letter-spacing:.01em;margin-top:2px;display:flex;align-items:baseline;gap:8px;}
.topbar h1 .tick{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:1px;}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:3px;}

/* ===== Bottom nav ===== */
.tabbar{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{appearance:none;border:none;background:none;padding:10px 4px 8px;font-family:inherit;color:var(--muted);
  font-size:11px;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.tabbar button .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
.tabbar button.active{color:var(--ink);font-weight:700;}
.tabbar button.active .dot{background:var(--accent);}

main{max-width:660px;margin:0 auto;padding:16px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.section-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.section-title .num{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.06em;}
.section-title h2{font-size:15px;}

.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:#0D110F;font-family:inherit;font-weight:700;
  font-size:13px;letter-spacing:.03em;padding:11px 16px;border-radius:var(--radius);cursor:pointer;text-align:center;}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#06140D;}
.btn.block{width:100%;display:block;}
.btn.sm{padding:7px 10px;font-size:11px;}
.btn:disabled{opacity:.35;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ===== Home ===== */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px;}
.week-day{text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);}
.week-day.today{border-color:var(--accent);}
.week-day .wd{font-size:9px;color:var(--muted);letter-spacing:.05em;}
.week-day .dnum{font-size:12px;font-weight:700;margin:3px 0;}
.week-day .badge{display:inline-block;min-width:18px;height:18px;line-height:18px;font-size:11px;font-weight:800;
  background:var(--accent);color:#06140D;border-radius:50%;}
.week-day .badge.empty{background:transparent;color:var(--line);border:1px dashed var(--line);}

.daypick{display:flex;flex-direction:column;gap:8px;}
.daypick .dbtn{border:1px solid var(--line);background:var(--paper2);border-radius:var(--radius);padding:12px 14px;
  text-align:left;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.daypick .dbtn .l{}
.daypick .dbtn .dl{font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:800;}
.daypick .dbtn .dn{font-size:14px;font-weight:700;margin-top:2px;color:var(--ink);}
.daypick .dbtn .dm{font-size:11px;color:var(--muted);margin-top:2px;}
.daypick .dbtn .key{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap;}
.daypick .dbtn.cardio{border-style:dashed;}

.check-item{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:12.5px;border-top:1px solid var(--line);}
.check-item:first-child{border-top:none;}
.check-item input{margin-top:3px;}
.deload-flag{margin-top:10px;padding:10px 12px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--radius);
  font-size:12.5px;color:var(--warn);font-weight:700;}

.note{font-size:12.5px;line-height:1.6;color:var(--muted);border-left:2px solid var(--accent);padding:6px 0 6px 10px;margin-top:8px;}

/* ===== Session ===== */
.dayhead{background:#000;color:#fff;padding:14px 16px;border-radius:var(--radius);margin-bottom:14px;border:1px solid var(--line);}
.dayhead .dl{font-size:10px;letter-spacing:.2em;color:var(--accent);font-weight:800;}
.dayhead h2{color:#fff;font-size:18px;margin-top:2px;}
.dayhead .meta{font-size:11.5px;color:var(--muted);margin-top:5px;}

.ex-card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.ex-head{background:var(--paper2);padding:10px 12px;border-bottom:1px solid var(--line);}
.ex-head .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.ex-head .name{font-size:14px;font-weight:800;}
.ex-head .en{font-size:9.5px;color:var(--muted);letter-spacing:.08em;}
.ex-head .presc{display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--muted);flex-wrap:wrap;}
.ex-head .presc b{color:var(--ink);font-weight:700;}
.ex-head .cue{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;}
.sugg{margin-top:8px;padding:8px 10px;background:var(--accent-soft);border:1px solid var(--accent-dim);border-radius:var(--radius);
  font-size:11.5px;color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sugg button{background:var(--accent);border:none;color:#06140D;font-weight:800;font-size:10.5px;padding:5px 9px;border-radius:20px;cursor:pointer;font-family:inherit;}

.set-table{width:100%;border-collapse:collapse;}
.set-table th{font-size:10px;color:var(--muted);text-align:left;padding:8px 8px 4px;letter-spacing:.04em;}
.set-table td{padding:4px 8px 8px;}
.set-table input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 6px;font-size:13px;color:var(--ink);text-align:center;}
.set-table input:focus{border-color:var(--accent);outline:none;}
.set-table .sn{font-size:12px;color:var(--muted);font-weight:700;text-align:center;}
.set-table .done-cell{text-align:center;}
.set-table .done-cell input[type=checkbox]{width:auto;}

.timer-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:0 12px 12px;
  padding:10px;border:1px dashed var(--accent-dim);border-radius:var(--radius);background:var(--accent-soft);
  color:var(--accent);font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;}
.timer-btn.running{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}

textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:10px;font-size:13px;resize:vertical;
  min-height:60px;background:var(--bg);}

/* ===== Progress tab ===== */
.wex-card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--paper2);}
.wex-card .top{display:flex;justify-content:space-between;align-items:baseline;}
.wex-card .name{font-size:13.5px;font-weight:700;}
.wex-card .cat{font-size:9.5px;color:var(--muted);letter-spacing:.06em;}
.wex-card .w{font-size:20px;font-weight:800;color:var(--accent);margin-top:6px;}
.wex-card .w span{font-size:11px;color:var(--muted);font-weight:500;}

.chain{display:flex;flex-direction:column;gap:0;margin-top:8px;}
.chain-node{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line);}
.chain-node:first-child{border-top:none;}
.chain-node .idx{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#06140D;font-weight:800;
  font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;}
.chain-node .txt b{display:block;font-size:13px;}
.chain-node .txt span{font-size:11.5px;color:var(--muted);}

table.data{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
table.data th,table.data td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;}
table.data th{background:var(--paper2);font-size:10.5px;letter-spacing:.04em;color:var(--muted);font-weight:700;}

/* ===== Log tab ===== */
.log-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.log-item .top{display:flex;justify-content:space-between;align-items:baseline;}
.log-item .date{font-size:13px;font-weight:800;}
.log-item .day{font-size:11px;color:var(--accent);font-weight:800;}
.log-ex{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:8px;}
.log-ex div{padding:2px 0;}
.log-ex b{color:var(--ink);}
.flag-list{margin-top:8px;font-size:11.5px;color:var(--accent);}
.log-item .del{font-size:11px;color:var(--warn);background:none;border:none;font-family:inherit;cursor:pointer;padding:0;margin-top:8px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

.wc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.wc-row label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
.wc-row input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:9px;font-size:13px;color:var(--ink);}
.wc-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px;}
.wc-table th,.wc-table td{border:1px solid var(--line);padding:6px;text-align:center;}
.wc-table th{background:var(--paper2);color:var(--muted);font-weight:700;font-size:10px;}

.faq-item{border-top:1px solid var(--line);padding:10px 0;}
.faq-item:first-child{border-top:none;}
.faq-item .q{font-size:13px;font-weight:700;}
.faq-item .a{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6;}

.hidden{display:none !important;}

/* ===== 深色主題 ===== */
[data-theme="dark"]{
  --bg:#111315;
  --paper:#1A1D20;
  --ink:#E9EBED;
  --accent:#E0A33C;
  --accent-dark:#0D0F11;
  --accent-soft:#2A2318;
  --line:#2B2F33;
  --muted:#959A9F;
  --warn:#E8846A;
  --warn-soft:#33221E;
}
[data-theme="dark"] .topbar{background:#0D0F11;}
[data-theme="dark"] .topbar .brand-eyebrow{color:#9A7736;}
[data-theme="dark"] .topbar .sub{color:#9AA0A5;}
.themebtn{
  position:absolute;top:16px;right:16px;
  width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);color:#fff;
  font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.themebtn:active{transform:scale(.94);}


/* ===== 動作示意圖 ===== */
.figrow{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:6px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 8px;margin-bottom:4px;
}
.figrow.one{grid-template-columns:1fr;max-width:60%;margin-left:auto;margin-right:auto;}
.figbox{min-width:0;}
.figsvg{width:100%;height:auto;display:block;}
.figbox figcaption{
  font-size:11px;line-height:1.45;text-align:center;
  color:var(--muted);margin-top:2px;padding:0 2px;
}
.figarrow{color:var(--accent);font-size:19px;font-weight:700;opacity:.65;}
/* 圖形顏色全部走變數 → 深色模式自動反轉 */
.figsvg .fl{stroke:var(--ink);stroke-linecap:round;fill:none;}
.figsvg .fl.dim{opacity:.30;}
.figsvg .fh{stroke:var(--ink);fill:var(--paper);}
.figsvg .fg{stroke:var(--ink);opacity:.25;}
.figsvg .fp{fill:var(--accent);}
.figsvg .fp2{fill:var(--ink);opacity:.17;}
.figsvg .fc{stroke:var(--accent);opacity:.55;fill:none;}
.figsvg .fa{stroke:var(--warn);fill:var(--warn);}

/* ===== 動作庫 ===== */
.exsearch{
  display:flex;align-items:center;gap:8px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;
}
.exsearch input{
  flex:1;border:0;background:transparent;color:var(--ink);
  font-size:15px;font-family:inherit;outline:none;min-width:0;
}
.exsearch .ic{opacity:.5;font-size:14px;}
.exfilters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.exfilters button{
  flex:0 0 auto;padding:6px 12px;font-size:12px;font-weight:700;
  border-radius:999px;border:1px solid var(--line);
  background:var(--paper);color:var(--muted);cursor:pointer;
  font-family:inherit;letter-spacing:.02em;
}
.exfilters button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.exrow{
  display:flex;align-items:center;gap:12px;
  padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;
}
.exrow:active{opacity:.6;}
.exrow .ini{
  flex:0 0 38px;height:38px;border-radius:var(--radius);
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;letter-spacing:.02em;
}
.exrow .tx{flex:1;min-width:0;}
.exrow .n{font-size:14.5px;font-weight:700;}
.exrow .e{font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:1px;}
.exrow .ar{color:var(--muted);font-size:18px;flex:0 0 auto;}
.exback{
  display:inline-flex;align-items:center;gap:5px;
  background:none;border:0;color:var(--accent);
  font-size:13px;font-weight:700;font-family:inherit;
  cursor:pointer;padding:0;margin-bottom:12px;
}
.exhead{margin-bottom:16px;}
.exhead h2{font-size:22px;letter-spacing:.01em;}
.exhead .en{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px;}
.exchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.exchip{
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);
}
.exsec{margin-top:20px;}
.exsec > .t{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:800;margin-bottom:9px;
}
.exsteps{counter-reset:s;list-style:none;}
.exsteps li{
  counter-increment:s;position:relative;
  padding-left:30px;margin-bottom:11px;font-size:14px;line-height:1.62;
}
.exsteps li::before{
  content:counter(s);position:absolute;left:0;top:1px;
  width:21px;height:21px;border-radius:50%;
  background:var(--accent);color:#fff;
  font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.exmiss{list-style:none;}
.exmiss li{
  position:relative;padding-left:20px;margin-bottom:9px;
  font-size:13.5px;line-height:1.6;color:var(--ink);
}
.exmiss li::before{
  content:'';position:absolute;left:4px;top:8px;
  width:6px;height:6px;border-radius:50%;background:var(--warn);
}
.exscale{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.exscale div{
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:11px 12px;
}
.exscale .h{font-size:10.5px;letter-spacing:.1em;font-weight:800;color:var(--muted);text-transform:uppercase;}
.exscale p{font-size:13px;line-height:1.55;margin-top:5px;}
.exsafe{
  background:var(--warn-soft);border-left:3px solid var(--warn);
  padding:11px 13px;border-radius:var(--radius);
  font-size:13.5px;line-height:1.6;
}
.exsafe b{color:var(--warn);}
.exwhere{
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:11px 13px;
  font-size:13px;line-height:1.6;color:var(--muted);
}
.exwhere b{color:var(--ink);}
.exresume{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;
  padding:11px 14px;margin:-2px 0 14px;
  border-radius:var(--radius);
  font-size:13.5px;font-weight:700;
  border:0;width:100%;font-family:inherit;cursor:pointer;
  letter-spacing:.02em;
}
.exresume:active{opacity:.85;}
.exresume .sp{margin-left:auto;font-weight:500;opacity:.85;font-size:12px;}

/* ===== 替代動作 ===== */
.exalt{list-style:none;padding:0;margin:0;}
.exalt li{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;}
.exalt .an{font-size:14px;font-weight:800;}
.exalt .ag{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.exalt .ah{font-size:13px;line-height:1.6;color:var(--muted);margin-top:6px;}
.exaltnote{font-size:12px;line-height:1.6;color:var(--muted);margin-top:6px;}

/* ===== 換動作 ===== */
.swapbtn{background:none;border:1px solid var(--accent);color:var(--accent);font-size:11px;font-weight:800;font-family:inherit;
  padding:3px 9px;border-radius:999px;cursor:pointer;margin-left:6px;letter-spacing:.03em;}
.swaptag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);}
.swp{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--bg);}
.swp .st{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--muted);margin-bottom:8px;}
.swp .opt{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;}
.swp .opt .an{font-size:13.5px;font-weight:800;}
.swp .opt .ag{font-size:11px;color:var(--muted);margin-top:2px;}
.swp .opt .rx{font-size:12px;margin-top:6px;color:var(--ink);}
.swp .opt .rx b{color:var(--accent);}
.swp .opt .go{margin-top:8px;width:100%;}
.exnone{padding:34px 10px;text-align:center;color:var(--muted);font-size:13.5px;}
.exguide{
  background:none;border:0;padding:0;margin-left:6px;
  color:var(--accent);font-size:11px;font-weight:800;
  font-family:inherit;cursor:pointer;letter-spacing:.04em;
  border-bottom:1px dotted var(--accent);
}

</style>

/* ============ STATE / STORAGE ============ */
const STORE_KEY = "thomas_gym_program_v1";
function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {sessions:[], weights:{}, weekChecks:[], deloadChecklist:{}, theme:"light"};
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ============ 訓練中草稿（Draft） ============
   解決手機瀏覽器把背景分頁記憶體整個清掉／重整，導致進行中的訓練
   （含 startTime，用來算時長）全部消失的問題。
   跟正式紀錄分開存一個 key，不會混進已完成的訓練。
   不做防抖、直接寫：系統可能在切出去的瞬間就回收分頁，
   延遲寫入等於在賭它不會在那零點幾秒內動手。 */
const DRAFT_KEY = STORE_KEY + "_draft";
function saveDraft(){
  if(!sessionCtx) return;
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify({sessionCtx: sessionCtx, savedAt: Date.now()}));
  }catch(e){}
}
function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}
function restoreDraftIfAny(){
  let raw = null;
  try{ raw = localStorage.getItem(DRAFT_KEY); }catch(e){ return; }
  if(!raw) return;
  let draft;
  try{ draft = JSON.parse(raw); }catch(e){ clearDraft(); return; }
  const ctx = draft && draft.sessionCtx;
  if(!ctx || !ctx.day){ clearDraft(); return; }
  // 防呆：草稿的 day 必須還存在於現在的課表（cardio 例外），否則是舊版資料，
  // 直接丟掉，不要拿去 render 導致整個 app 掛掉。
  if(ctx.day!=="cardio" && !DAYS[ctx.day]){ clearDraft(); return; }
  if(ctx.day!=="cardio" && !ctx.swaps) ctx.swaps = {};
  const doneSets = Array.isArray(ctx.sets)
    ? ctx.sets.reduce((a,rows)=> a + rows.filter(r=> r.weight!=="" || r.reps!=="").length, 0)
    : 0;
  const ago = draft.savedAt ? Math.max(0, Math.round((Date.now()-draft.savedAt)/60000)) : null;
  const what = ctx.day==="cardio" ? "有氧" : ("DAY "+ctx.day+"，已填 "+doneSets+" 組");
  const msg = "偵測到一次中斷的訓練（"+what
    + (ago!==null ? "，約 "+ago+" 分鐘前中斷" : "") + "）。要繼續這次訓練嗎？\n\n選「取消」會放棄這次沒存檔的紀錄。";
  if(confirm(msg)){
    sessionCtx = ctx;
    currentTab = "session";
  } else {
    clearDraft();
  }
}

/* 開始／結束時間戳都在才算時長；不足 1 分鐘算 1 分鐘，避免顯示「0 分鐘」看起來像沒運動 */
function sessionDurationMin(s){
  if(typeof s.startTime!=="number" || typeof s.endTime!=="number") return null;
  return Math.max(1, Math.round((s.endTime - s.startTime)/60000));
}

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function incrementFor(cat){
  if(cat==="BIG_LOWER") return {amt:5, unit:"kg", label:"+5 kg"};
  if(cat==="BIG_UPPER") return {amt:2.5, unit:"kg", label:"+2.5 kg"};
  return null; // OTHER / OTHER_DB handled with generic text
}
function repCeiling(repsStr){
  const nums = repsStr.match(/\d+(\.\d+)?/g);
  if(!nums) return null;
  return parseFloat(nums[nums.length-1]);
}
function parseRestSeconds(label){
  const nums = label.match(/[\d.]+/g);
  if(!nums) return 90;
  const n = parseFloat(nums[nums.length-1]);
  return label.includes("min") ? Math.round(n*60) : Math.round(n);
}

/* 取「實際要做的動作」：有換就回傳替代動作（名稱、組數、次數、RIR、休息都換），否則原動作。
   替代動作用自己的名字記重量，所以重量進度不會和原動作混在一起。
   大重量動作的替代一律當一般動作，不套用 +5／+2.5 kg 的自動加重規則。 */
function exAt(dayKey, i, swaps){
  const base = DAYS[dayKey].exercises[i];
  const ai = swaps ? swaps[i] : null;
  if(ai===null || ai===undefined) return base;
  const a = (ALT_LIB[base.en]||[])[ai];
  if(!a) return base;
  const rx = ALT_RX[base.en+"|"+a.n] || [];
  const pick = (v,d)=> (v===null||v===undefined) ? d : v;
  return {
    name:a.n, en:null,
    sets:pick(rx[0],base.sets), reps:pick(rx[1],base.reps),
    rir:pick(rx[2],base.rir), rest:pick(rx[3],base.rest),
    load:"試重", cat: base.cat==="OTHER_DB" ? "OTHER_DB" : "OTHER",
    note:"替代 "+base.name+"｜需要："+a.g+"。"+a.h+(/^徒手/.test(a.g)?" 徒手動作的重量欄請填 0。":""),
    swapOf:base.name
  };
}
function blankSets(n){ return Array.from({length:n}, ()=>({weight:"",reps:"",rir:"",done:false})); }

/* 課表 → 動作庫索引的來源（各 app 課表結構不同，這裡轉成統一格式） */
function EX_SOURCE(){
  const out = [];
  Object.entries(DAYS).forEach(([k,d])=>{
    (d.exercises||[]).forEach(x=>{
      if(x && x.en) out.push({en:x.en, name:x.name, where:"DAY "+k+" · "+d.name});
    });
  });
  return out;
}

/* ============================================================
   動作示意圖
   姿勢用「關節座標」描述，圖形由 figSVG() 畫出來，所以 40 幾個動作
   不用各畫一張圖，只要給起始／結束兩組座標。
   顏色全部用 currentColor / CSS 變數 → 深色淺色主題自動跟著變。
   座標系：viewBox 0 0 200 200，地面 y=178，人物面向右。
   ============================================================ */
const FIG_GROUND = 178;

/* 關節縮寫：
   hdc 頭中心 / nk 頸 / sh 肩 / el 肘 / wr 腕 / hp 髖 / kn 膝 / an 踝 / to 腳尖
   far* = 另一側手腳（畫淺一點，做出立體感） */
function figSVG(p, opts){
  opts = opts || {};
  const L = (a,b,w,cls) => (!a||!b) ? "" :
    `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="${cls||'fl'}" stroke-width="${w||5}"/>`;
  let g = "";

  // 地面
  if(opts.ground !== false){
    g += `<line x1="8" y1="${FIG_GROUND}" x2="192" y2="${FIG_GROUND}" class="fg" stroke-width="2"/>`;
  }
  // 器材（畫在人物後面）
  if(opts.propsBack) g += opts.propsBack;

  // 遠側手腳：先畫，顏色淡
  g += L(p.hp, p.farKn, 5, 'fl dim');
  g += L(p.farKn, p.farAn, 5, 'fl dim');
  g += L(p.farAn, p.farTo, 4, 'fl dim');
  g += L(p.sh, p.farEl, 4.5, 'fl dim');
  g += L(p.farEl, p.farWr, 4.5, 'fl dim');

  // 軀幹、近側四肢
  g += L(p.nk, p.hp, 6.5);
  g += L(p.hp, p.kn, 5.5);
  g += L(p.kn, p.an, 5.5);
  g += L(p.an, p.to, 4.5);
  g += L(p.sh, p.el, 5);
  g += L(p.el, p.wr, 5);

  // 頭
  // 頭是實心（填卡片底色）：讓從頭後方經過的手臂被遮住，讀起來才像「手在頭後面」，
  // 而不是一條線直接穿過臉。
  if(p.hdc) g += `<circle cx="${p.hdc[0]}" cy="${p.hdc[1]}" r="${p.hdr||10}" class="fh" stroke-width="4.5"/>`;

  // 器材（畫在人物前面）
  if(opts.propsFront) g += opts.propsFront;
  // 箭頭／標註
  if(opts.marks) g += opts.marks;
  return g;
}

/* ---------- 器材 ---------- */
// 啞鈴：橫桿＋兩端方塊。ang 是旋轉角度（度）
function dumbbell(x,y,ang,s){
  s = s || 1; ang = ang || 0;
  const w = 9*s, h = 7*s, gap = 5*s;
  return `<g transform="translate(${x},${y}) rotate(${ang})" class="fp">
    <rect x="${-gap}" y="${-1.6*s}" width="${gap*2}" height="${3.2*s}" rx="1"/>
    <rect x="${-gap-w/2}" y="${-h/2}" width="${w/2}" height="${h}" rx="1.5"/>
    <rect x="${gap}" y="${-h/2}" width="${w/2}" height="${h}" rx="1.5"/>
  </g>`;
}
// 槓鈴：長桿＋兩端槓片
function barbell(x,y,ang,half){
  half = half || 34;
  return `<g transform="translate(${x},${y}) rotate(${ang||0})" class="fp">
    <rect x="${-half}" y="-1.8" width="${half*2}" height="3.6" rx="1.5"/>
    <rect x="${-half-2}" y="-9" width="5" height="18" rx="2"/>
    <rect x="${half-3}" y="-9" width="5" height="18" rx="2"/>
  </g>`;
}
// 椅子／臥推椅（側視）
function bench(x,y,w,h){
  w=w||54; h=h||9;
  return `<g class="fp2">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>
    <rect x="${x+4}" y="${y+h}" width="4" height="${FIG_GROUND-y-h}"/>
    <rect x="${x+w-8}" y="${y+h}" width="4" height="${FIG_GROUND-y-h}"/>
  </g>`;
}
// 有靠背的椅子（側視，靠背在左）
function chairBack(x,y){
  return `<g class="fp2">
    <rect x="${x}" y="${y}" width="46" height="8" rx="2"/>
    <rect x="${x}" y="${y-38}" width="8" height="40" rx="2"/>
    <rect x="${x+4}" y="${y+8}" width="4" height="${FIG_GROUND-y-8}"/>
    <rect x="${x+38}" y="${y+8}" width="4" height="${FIG_GROUND-y-8}"/>
  </g>`;
}
// 牆／垂直面
function wall(x){
  return `<rect x="${x}" y="20" width="6" height="${FIG_GROUND-20}" rx="2" class="fp2"/>`;
}
// 單槓／高位滑輪橫桿
function highBar(y,x1,x2){
  return `<g class="fp2"><rect x="${x1||40}" y="${y}" width="${(x2||160)-(x1||40)}" height="4" rx="2"/></g>`;
}
// 纜繩
function cable(a,b){
  return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="fc" stroke-width="2"/>`;
}
// 機器立柱（右側）
function machine(x){
  return `<g class="fp2"><rect x="${x}" y="30" width="8" height="${FIG_GROUND-30}" rx="2"/></g>`;
}
// 箭頭：標示動作方向
function arrow(x1,y1,x2,y2){
  const ang = Math.atan2(y2-y1, x2-x1)*180/Math.PI;
  return `<g class="fa">
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="2.2" stroke-dasharray="5 4"/>
    <g transform="translate(${x2},${y2}) rotate(${ang})">
      <path d="M0 0 L-7 -4 L-7 4 Z"/>
    </g>
  </g>`;
}

/* ---------- 器材掛在關節上 ----------
   姿勢只描述身體，器材依動作不同掛上去，所以同一個「深蹲」姿勢
   可以是高腳杯蹲（啞鈴在胸前）或背蹲舉（槓在肩上）。 */
function gearSVG(kind, p){
  if(!kind || !p) return "";
  const mid = (a,b,t)=> [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  switch(kind){
    case 'db':      // 雙手各一顆啞鈴
      return dumbbell(p.wr[0], p.wr[1], 0) + (p.farWr ? dumbbell(p.farWr[0], p.farWr[1], 0, .85) : "");
    case 'db1':     // 單手一顆
      return dumbbell(p.wr[0], p.wr[1], 0);
    case 'goblet':  // 一顆抱在胸前
      { const c = mid(p.nk, p.hp, .28); return dumbbell(c[0]+10, c[1], 90); }
    case 'dbmid':   // 一顆垂在兩腿中間（相撲蹲）
      { const c = p.wr; return dumbbell(c[0], c[1], 90); }
    case 'bbBack':  // 槓在上背
      return barbell(p.sh[0]+2, p.sh[1]+4, 0, 30);
    case 'bbHand':  // 槓握在手上
      return barbell(p.wr[0], p.wr[1], 0, 30);
    case 'plate':   // 槓片／負重（提踵、單槓負重）
      return dumbbell(p.wr[0], p.wr[1], 90);
    default: return "";
  }
}

/* 畫一個動作的圖（起始／結束兩格，或單格） */
function figPanel(poseName, cap, gear){
  const pose = P[poseName];
  if(!pose) return "";
  const body = figSVG(pose.p, pose) + gearSVG(gear, pose.p);
  return `<figure class="figbox">
    <svg viewBox="0 0 200 200" class="figsvg" aria-hidden="true">${body}</svg>
    <figcaption>${cap}</figcaption>
  </figure>`;
}
function exFigures(en){
  const f = EX_FIG[en];
  if(!f) return "";
  if(f.one) return `<div class="figrow one">${figPanel(f.one[0], f.one[1], f.gear)}</div>`;
  return `<div class="figrow">
    ${figPanel(f.a[0], f.a[1], f.gear)}
    <div class="figarrow">→</div>
    ${figPanel(f.b[0], f.b[1], f.gear)}
  </div>`;
}

/* ============ 動作庫畫面 ============ */
let exQuery = "";
let exPart = "全部";
let exOpen = null;   // 目前展開的動作 en，null = 列表

function exIndex(){
  // 回傳 [{en, name, part, where:[...]}, ...]，依課表實際出現的動作組成。
  const map = {};
  EX_SOURCE().forEach(item=>{
    const lib = EX_LIB[item.en] || null;
    if(!map[item.en]) map[item.en] = {
      en:item.en, name:item.name,
      part: lib ? lib.part : "其他",
      where:[], lib:lib
    };
    map[item.en].where.push(item.where);
  });
  return Object.values(map);
}
function exParts(){
  const order = ["全部","下肢","上肢推","上肢拉","上肢","核心","全身","體能","其他"];
  const have = new Set(exIndex().map(x=>x.part));
  return order.filter(p=> p==="全部" || have.has(p));
}
// 訓練中來查動作時，給一個明確的回去入口。
// 不能讓人只能用下面的分頁列返回——那條路會清掉進行中的訓練。
function exResumeBar(){
  if(!sessionCtx) return "";
  return `<button class="exresume" data-exresume="1">‹ 返回訓練<span class="sp">進行中的訓練還在</span></button>`;
}
function renderExercises(){
  if(exOpen) return exResumeBar() + renderExerciseDetail(exOpen);
  const q = exQuery.trim().toLowerCase();
  let list = exIndex();
  if(exPart!=="全部") list = list.filter(x=> x.part===exPart);
  if(q) list = list.filter(x=>
    x.name.toLowerCase().includes(q) || x.en.toLowerCase().includes(q) ||
    (x.lib && (x.lib.muscles||"").toLowerCase().includes(q))
  );
  list.sort((a,b)=> a.part===b.part ? a.name.localeCompare(b.name,"zh-Hant") : 0);
  return `
    ${exResumeBar()}
    <div class="card">
      <div class="section-title"><span class="num">動作</span><h2>動作庫</h2></div>
      <div class="exsearch">
        <span class="ic">🔍</span>
        <input id="exq" type="text" placeholder="搜尋動作名稱或部位" value="${exQuery.replace(/"/g,'&quot;')}">
      </div>
      <div class="exfilters">
        ${exParts().map(p=>`<button data-expart="${p}" class="${p===exPart?'on':''}">${p}</button>`).join("")}

function bindExercises(){
  const q = document.getElementById("exq");
  if(q) q.addEventListener("input", e=>{
    exQuery = e.target.value;
    // 只重畫列表，不動整頁，否則每打一個字輸入框就失焦
    const host = document.getElementById("view");
    const cur = e.target.selectionStart;
    host.innerHTML = renderExercises();
    bindDynamic();
    const nq = document.getElementById("exq");
    if(nq){ nq.focus(); nq.setSelectionRange(cur, cur); }
  });
  document.querySelectorAll("[data-expart]").forEach(b=> b.addEventListener("click", ()=>{
    exPart = b.dataset.expart; render();
  }));
  document.querySelectorAll("[data-exopen]").forEach(b=> b.addEventListener("click", ()=>{
    exOpen = b.dataset.exopen; window.scrollTo(0,0); render();
  }));
  const resume = document.querySelector("[data-exresume]");
  if(resume) resume.addEventListener("click", ()=>{
    exOpen = null; currentTab = "session"; window.scrollTo(0,0); render();
  });
  const back = document.querySelector("[data-exback]");
  if(back) back.addEventListener("click", ()=>{ exOpen = null; window.scrollTo(0,0); render(); });
  // 訓練中／說明頁的「怎麼做」快捷
  document.querySelectorAll("[data-exjump]").forEach(b=> b.addEventListener("click", (e)=>{
    e.stopPropagation();
    exOpen = b.dataset.exjump; currentTab = "ex"; window.scrollTo(0,0); render();
  }));
}

function applyTheme(){
  const t = state.theme || "light";
  document.body.setAttribute("data-theme", t);
  const btn = document.getElementById("themeBtn");
  if(btn){
    btn.textContent = t==="dark" ? "☀" : "☾";
    btn.setAttribute("aria-label", t==="dark" ? "切換淺色" : "切換深色");
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t==="dark" ? "#0D0F11" : THEME_LIGHT_BAR);
}
function toggleTheme(){
  state.theme = (state.theme==="dark") ? "light" : "dark";
  saveState(); applyTheme();
}

/* ============ ROUTER ============ */
let currentTab = "home";
let sessionCtx = null;
const tabbar = document.querySelectorAll(".tabbar button");
// 切換分頁本來就會丟掉進行中的 sessionCtx，草稿也要一起清掉——
// 否則 app 認為「沒有訓練中」但草稿還留著，下次開啟會莫名跳出還原提示。
tabbar.forEach(btn=>{ btn.addEventListener("click", ()=>{ currentTab=btn.dataset.tab; if(sessionCtx) clearDraft(); sessionCtx=null; render(); }); });

function render(){
  tabbar.forEach(b=> b.classList.toggle("active", b.dataset.tab===currentTab));
  const view = document.getElementById("view");
  if(currentTab==="home") view.innerHTML = renderHome();
  else if(currentTab==="progress") view.innerHTML = renderProgress();
  else if(currentTab==="log") view.innerHTML = renderLog();
  else if(currentTab==="guide") view.innerHTML = renderGuide();
  else if(currentTab==="ex") view.innerHTML = renderExercises();
  else if(currentTab==="session") view.innerHTML = renderSession();
  bindDynamic();
  saveDraft();
}

/* ============ SESSION ============ */
function startSession(dayKey){
  // 開始／結束時間戳——相減得出訓練時長。不是碼表累加，所以中途切出去、
  // 鎖螢幕、分頁被凍結都不影響準確度。用途：讓紀錄能顯示「日期＋時長」，
  // 符合運動i台灣這類活動要求的運動紀錄佐證格式。
  if(dayKey==="cardio"){
    sessionCtx = {day:"cardio", note:"", startTime:Date.now(), endTime:null};
  } else {
    const d = DAYS[dayKey];
    sessionCtx = {
      day: dayKey,
      startTime: Date.now(),
      endTime: null,
      sets: d.exercises.map(ex=> blankSets(ex.sets)),
      swaps: {},
      swapOpen: null,
      note: ""
    };
  }
  currentTab="session"; render();
}

function renderExerciseCard(ex, i){

  const w = state.weights[ex.name] || {};

          <tr>
            <td class="sn">${si+1}</td>

            <td><input type="number" inputmode="numeric" data-r="${i}-${si}" value="${r.reps}" placeholder="${repCeiling(ex.reps)||'—'}"></td>
            <td><input type="number" inputmode="numeric" data-i="${i}-${si}" value="${r.rir}" placeholder="${ex.rir!=="—"?ex.rir:''}"></td>
            <td class="done-cell"><input type="checkbox" data-d="${i}-${si}" ${r.done?"checked":""}></td>
          </tr>`).join("")}
      </table>
      <button class="timer-btn" data-timer="${i}" data-rest="${parseRestSeconds(ex.rest)}">⏱ 組間休息 ${ex.rest}</button>
    </div>
  `;
}

function bindTimer(idx, secs){
  if(timerInterval) return;
  const btn = document.querySelector(`[data-timer="${idx}"]`);
  let remain = secs;
  timerInterval = setInterval(()=>{
    remain--;
    if(remain<=0){
      clearInterval(timerInterval); timerInterval=null;
      btn.classList.remove("running");
      btn.textContent = "✓ 休息完成，開始下一組";
      if(navigator.vibrate) navigator.vibrate([200,80,200]);
      setTimeout(()=>{ if(btn) btn.textContent = `⏱ 組間休息 ${exAt(sessionCtx.day,idx,sessionCtx.swaps).rest}`; }, 2500);
    } else {
      btn.textContent = `⏱ 休息中 · ${Math.floor(remain/60)}:${String(remain%60).padStart(2,"0")}`;
    }
  },1000);
  btn.classList.add("running");
  btn.textContent = `⏱ 休息中 · ${Math.floor(remain/60)}:${String(remain%60).padStart(2,"0")}`;
}

            ${durBlock}
            ${s.note?`<div class="log-ex">📝 ${s.note}</div>`:""}
            <button class="del" data-del="${s.id}">刪除這筆紀錄</button>
          </div>`;
        }
        const d = DAYS[s.day];
        return `
        <div class="log-item">
          <div class="top"><span class="date">${s.date}</span><span class="day">DAY ${s.day} · ${d.name}</span></div>
          ${durBlock}
          <div class="log-ex">
            ${d.exercises.map((baseEx,i)=>{
              const ex = exAt(s.day,i,s.swaps);
              const rows = s.sets[i].filter(r=>r.weight||r.reps);
              if(rows.length===0) return "";
              const summary = rows.map(r=>`${r.weight||"—"}kg×${r.reps||"—"}${r.rir!==""?" RIR"+r.rir:""}`).join("、");
              return `<div><b>${ex.name}</b>${ex.swapOf?`（替代 ${ex.swapOf}）`:""}：${summary}</div>`;
            }).join("")}
          </div>
          ${s.flags && s.flags.length>0 ? `<div class="flag-list">${s.flags.map(f=>"↗ "+f).join("<br>")}</div>` : ""}
          ${s.note?`<div class="log-ex">📝 ${s.note}</div>`:""}
          <button class="del" data-del="${s.id}">刪除這筆紀錄</button>
        </div>`;
      }).join("")
    }
  `;
}

/* ============ BIND DYNAMIC ============ */
function bindDynamic(){
  document.querySelectorAll("[data-start]").forEach(b=> b.addEventListener("click", ()=> startSession(b.dataset.start)));

  document.querySelectorAll("[data-deload]").forEach(cb=>{
    cb.addEventListener("change", (e)=>{
      state.deloadChecklist[cb.dataset.deload] = e.target.checked;
      saveState(); render();
    });
  });

  // session inputs
  document.querySelectorAll("[data-w]").forEach(inp=> inp.addEventListener("input", e=>{
    const [i,si]=inp.dataset.w.split("-").map(Number); sessionCtx.sets[i][si].weight = e.target.value;
  }));
  document.querySelectorAll("[data-r]").forEach(inp=> inp.addEventListener("input", e=>{
    const [i,si]=inp.dataset.r.split("-").map(Number); sessionCtx.sets[i][si].reps = e.target.value;
  }));
  document.querySelectorAll("[data-i]").forEach(inp=> inp.addEventListener("input", e=>{
    const [i,si]=inp.dataset.i.split("-").map(Number); sessionCtx.sets[i][si].rir = e.target.value;
  }));
  document.querySelectorAll("[data-d]").forEach(inp=> inp.addEventListener("change", e=>{
    const [i,si]=inp.dataset.d.split("-").map(Number); sessionCtx.sets[i][si].done = e.target.checked;
  }));
  document.querySelectorAll("[data-swapopen]").forEach(b=> b.addEventListener("click", ()=>{
    const i = +b.dataset.swapopen;
    sessionCtx.swapOpen = (sessionCtx.swapOpen===i) ? null : i;
    render();
  }));
  document.querySelectorAll("[data-swapto]").forEach(b=> b.addEventListener("click", ()=>{
    const [is, ai] = b.dataset.swapto.split("-");
    const i = +is;
    const hasData = sessionCtx.sets[i].some(r=> r.weight!=="" || r.reps!=="" || r.rir!=="" || r.done);
    if(hasData && !confirm("這個動作已經填了紀錄，換動作會清掉這個動作已填的組數。要換嗎？")) return;
    if(!sessionCtx.swaps) sessionCtx.swaps = {};
    if(ai==="back") delete sessionCtx.swaps[i]; else sessionCtx.swaps[i] = +ai;
    sessionCtx.sets[i] = blankSets(exAt(sessionCtx.day,i,sessionCtx.swaps).sets);
    sessionCtx.swapOpen = null;
    render();
  }));
  document.querySelectorAll("[data-timer]").forEach(b=> b.addEventListener("click", ()=> bindTimer(+b.dataset.timer, +b.dataset.rest)));
  document.querySelectorAll("[data-apply-sugg]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const name = b.dataset.applySugg, amt = parseFloat(b.dataset.amt);
      const w = state.weights[name] || {};
      const base = w.current!=null ? w.current : 0;
      w.current = base + amt; w.suggested = null;
      state.weights[name] = w; saveState(); render();
    });
  });
  const noteEl = document.getElementById("sessionNote");
  if(noteEl) noteEl.addEventListener("input", e=> sessionCtx.note = e.target.value);

  const finishBtn = document.getElementById("finishSession");
  if(finishBtn) finishBtn.addEventListener("click", ()=>{
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    const startTime = sessionCtx.startTime || null;
    const endTime = startTime ? Date.now() : null;
    if(sessionCtx.day==="cardio"){
      state.sessions.push({id:Date.now(), date:todayStr(), day:"cardio", note:sessionCtx.note, startTime, endTime});
    } else {
      const d = DAYS[sessionCtx.day];
      const flags = [];
      d.exercises.forEach((baseEx,i)=>{
        const ex = exAt(sessionCtx.day,i,sessionCtx.swaps);
        const rows = sessionCtx.sets[i].filter(r=>r.weight!=="" && r.reps!=="");
        if(rows.length < ex.sets) return;
        // update current weight to the most recent logged weight
        const lastWeight = parseFloat(rows[rows.length-1].weight);
        if(!isNaN(lastWeight)){
          const w = state.weights[ex.name] || {};
          w.current = lastWeight;
          state.weights[ex.name] = w;
        }
        const ceiling = repCeiling(ex.reps);
        const prescRir = parseFloat(ex.rir);
        const hitCeiling = rows.every(r=> parseFloat(r.reps) >= ceiling);
        const rirOk = isNaN(prescRir) ? true : rows.every(r=> r.rir!=="" && parseFloat(r.rir) >= prescRir);
        if(hitCeiling && rirOk){
          const inc = incrementFor(ex.cat);
          if(inc){
            const w = state.weights[ex.name] || {};
            w.suggested = {text:`${ex.name} 已達標 → 下次加重`, amt:inc.amt};
            state.weights[ex.name] = w;
            flags.push(`${ex.name}：已達標，下次 ${inc.label}`);
          } else {
            flags.push(`${ex.name}：次數已達上限且 RIR 足夠，可考慮加最小重量（啞鈴 +2kg／滑輪 +2.5kg）`);
          }
        }
      });
      state.sessions.push({id:Date.now(), date:todayStr(), day:sessionCtx.day, sets:sessionCtx.sets, swaps:sessionCtx.swaps||{}, note:sessionCtx.note, flags, startTime, endTime});
    }
    saveState(); clearDraft(); sessionCtx=null; currentTab="log"; render();
  });
  const cancelBtn = document.getElementById("cancelSession");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=>{
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    clearDraft(); sessionCtx=null; currentTab="home"; render();
  });

  bindExercises();
  // log
  document.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click", ()=>{
    if(!confirm("確定刪除這筆紀錄？")) return;
    state.sessions = state.sessions.filter(s=> s.id !== +b.dataset.del);
    saveState(); render();
  }));
  const addWc = document.getElementById("addWeekCheck");
  if(addWc) addWc.addEventListener("click", ()=>{
    state.weekChecks.push({
      week: document.getElementById("wcWeek").value || `#${state.weekChecks.length+1}`,
      sessions: document.getElementById("wcSessions").value || "0",
      sleep: document.getElementById("wcSleep").value || "—",
      bw: document.getElementById("wcBw").value || "—",
      energy: document.getElementById("wcEnergy").value || "—",
      recovery: document.getElementById("wcRecovery").value || "—"
    });
    saveState(); render();
  });
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`thomas-backup-${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
  });
  const importFile = document.getElementById("importFile");
  if(importFile) importFile.addEventListener("change", e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!confirm("匯入將覆蓋目前所有紀錄，確定嗎？")) return;
        state = {sessions:data.sessions||[], weights:data.weights||{}, weekChecks:data.weekChecks||[], deloadChecklist:data.deloadChecklist||{}};
        saveState(); render();
      }catch(err){ alert("檔案格式錯誤，無法匯入"); }
    };
    reader.readAsText(file);
  });
}

// 分頁切到背景／即將關閉的瞬間強制存一次草稿——iOS Safari 真的會隨時把
// 背景分頁記憶體整個清掉，不能只靠使用者操作觸發的 render() 去存。
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") saveDraft(); });
window.addEventListener("pagehide", saveDraft);

applyTheme();
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
restoreDraftIfAny();
render();
</script>
